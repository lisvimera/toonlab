<!doctype html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="color-scheme" content="dark">
	<title>Kora - Independent Creative Agency</title>
	<link rel="icon" href="/icon.svg" type="image/svg+xml">
	<link rel="stylesheet" href="./css/style.css">
</head>

<body>
	<div class="content-wrapper">
		<div class="kora-loader" role="status" aria-label="Loading Kora">
			<div class="kora-loader-bunny">
				<svg viewBox="-4 -4 128 128" width="128" height="128" aria-hidden="true">
					<g fill="#c8c3f2" stroke="#c8c3f2" stroke-width="5" stroke-linejoin="round">
						<ellipse cx="60" cy="31" rx="8.5" ry="24" transform="rotate(26 60 31)" />
						<ellipse cx="79" cy="35" rx="8.5" ry="23" transform="rotate(47 79 35)" />
						<path d="M17 90C17 59 36 43 60 43s43 16 43 47c0 5-3 8-8 8H25c-5 0-8-3-8-8Z" />
						<rect x="39" y="94" width="15" height="13" rx="6.5" />
						<rect x="63" y="94" width="15" height="13" rx="6.5" />
					</g>
					<g fill="#000">
						<ellipse cx="60" cy="31" rx="8.5" ry="24" transform="rotate(26 60 31)" />
						<ellipse cx="79" cy="35" rx="8.5" ry="23" transform="rotate(47 79 35)" />
						<path d="M17 90C17 59 36 43 60 43s43 16 43 47c0 5-3 8-8 8H25c-5 0-8-3-8-8Z" />
						<rect x="39" y="94" width="15" height="13" rx="6.5" />
						<rect x="63" y="94" width="15" height="13" rx="6.5" />
					</g>
					<ellipse cx="47" cy="70" rx="4.5" ry="6.5" fill="#c8c3f2" />
					<ellipse cx="64" cy="70" rx="4.5" ry="6.5" fill="#c8c3f2" />
				</svg>
			</div>
			<div class="kora-loader-shadow"></div>
		</div>
		<div class="content">
			<div class="header">
				<div class="header-logo"><svg viewBox="0 0 260 90" fill="none" xmlns="http://www.w3.org/2000/svg"
						role="img" aria-label="LNA Artes Plásticas"><text x="130" y="61" text-anchor="middle"
							fill="white" font-family="Arial, sans-serif" font-weight="700" font-size="64"
							letter-spacing="-3">LNA</text><text x="130" y="83" text-anchor="middle" fill="#b9bbc6"
							font-family="Arial, sans-serif" font-size="9" letter-spacing="3">ARTES
							PLÁSTICAS</text></svg>
				</div>
			</div>
			<div class="section-wrap" data-visible="false">
				<div class="scroll">
					<button class="scroll-btn">EXPLORE</button>
					<div class="scroll-fillCircle"></div>
					<svg class="scroll-circle" xmlns="http://www.w3.org/2000/svg" width="200" height="200"
						viewBox="0 0 200 200" fill="none" color="#fff">
						<defs>
							<linearGradient id="spinner-gradient">
								<stop offset="0%" stop-opacity="0" stop-color="currentColor" />
								<stop offset="100%" stop-opacity="1" stop-color="currentColor" />
							</linearGradient>
						</defs>
						<circle cx="100" cy="100" r="98" fill="none" stroke="url(#spinner-gradient)" stroke-width="2" />
					</svg>
				</div>
				<canvas id="canvas"></canvas>
				<div class="subtitles">
				</div>
				<div class="section section1">
				</div>
				<div class="section section2">
					<div class="section2-links-container">
						<!-- Instagram -->
						<a href="https://www.instagram.com/anelehonerom/" target="_blank" rel="noopener noreferrer" class="pill-btn">
							<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
								<rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
								<path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
								<line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
							</svg>
							<span>Instagram</span>
						</a>

						<!-- YouTube -->
						<a href="https://www.youtube.com/@LNA_toonlab" target="_blank" rel="noopener noreferrer" class="pill-btn">
							<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
								<path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
							</svg>
							<span>YouTube</span>
						</a>

						<!-- INPRNT -->
						<a href="https://www.inprnt.com/gallery/lna/" target="_blank" rel="noopener noreferrer" class="pill-btn">
							<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
								<path d="M12 2l2.4 7.4H22l-6 4.6 2.3 7.2L12 16.8 5.7 21.2 8 14 2 9.4h7.6z"/>
							</svg>
							<span>INPRNT</span>
						</a>
					</div>
				</div>
			</div>
			<div class="footer">
				<div class="footer-timeline">
					<button class="footer-timeline-item" type="button" data-section="1"
						aria-label="Brand strategy"></button>
					<button class="footer-timeline-item" type="button" data-section="2"
						aria-label="Digital experiences"></button>
				</div>
				<button class="footer-continue" type="button" aria-label="Continue to the page">Continue <span
						aria-hidden="true">↓</span></button>
				<div class="footer-copyright">
					Tubitoons © 2026 - Bitácora de Artes Plásticas
				</div>
			</div>
		</div>
	</div>
	<script src="./js/script.js"></script>
</body>

</html>
